name: flutter_phongmay
description: "Ứng dụng Quản lý phòng máy - Cao Thắng (Clean Architecture)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- TẦNG NETWORK & API (Giao tiếp với Phúc) ---
  dio: ^5.9.2
  retrofit: ^4.9.2

  # --- TẦNG STATE MANAGEMENT & DI ---
  flutter_riverpod: ^2.6.1
  get_it: ^9.2.1

  # --- TẦNG MODEL & DATA ---
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0

  # --- LƯU TRỮ LOCAL ---
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.2.0

  # --- UI & TIỆN ÍCH CỦA APP MÌNH ---
  go_router: ^17.2.3          # Điều hướng
  mobile_scanner: ^7.2.0      # Quét mã QR (Cực kỳ quan trọng)
  intl: ^0.20.2               # Format ngày tháng
  elegant_notification: ^2.5.1 # Thông báo popup đẹp
  flutter_dotenv: ^5.0.2
  http: ^1.6.0
  provider: ^6.0.5
  table_calendar: ^3.0.8
  supabase_flutter: ^2.15.0
  crypto: ^3.0.2
  file_picker: ^11.0.2
  flutter_launcher_icons: ^0.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # --- CỖ MÁY TỰ ĐỘNG SINH CODE ---
  build_runner: ^2.3.0
  freezed: ^3.2.5
  json_serializable: ^6.12.0
  retrofit_generator: ^10.2.6

flutter:
  uses-material-design: true
  
 
  assets:
    - assets/img/logo.png
    - .env
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/logo/images.png"
  min_sdk_android: 21