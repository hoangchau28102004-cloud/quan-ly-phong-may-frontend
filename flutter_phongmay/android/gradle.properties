org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Disable Kotlin incremental compilation to avoid incremental cache issues across different drives
# (fixes errors like "Could not close incremental caches" when Gradle/Kotlin accesses pub cache on another drive)
kotlin.incremental=false
